name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · Lint · 测试 · 构建
    runs-on: ubuntu-latest

    # 集成测试跑在容器里的 Postgres，而不是远端 Supabase。
    # 两个理由：跨海往返会让整套测试从几十秒变成几分钟；
    # 而且 CI 不应该依赖一个共享的、可能被别的分支同时写入的数据库。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betterme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      PAY_WEBHOOK_SECRET: ci-only-secret-not-used-in-production
      SESSION_TTL_HOURS: "720"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npx prisma generate

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 测试自己会重建 test schema 并执行仓库里的迁移 SQL，
      # 所以这一步同时验证了「迁移脚本本身是能跑的」
      - name: 测试（单元 + 集成）
        run: npm run test:cov

      - name: 生产构建
        run: npm run build

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
