name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · Lint · 测试 · 构建
    runs-on: ubuntu-latest

    # 集成测试跑在容器里的 Postgres，而不是远端 Supabase。
    # 两个理由：跨海往返会让整套测试从几十秒变成几分钟；
    # 而且 CI 不应该依赖一个共享的、可能被别的分支同时写入的数据库。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betterme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/betterme_test
      PAY_WEBHOOK_SECRET: ci-only-secret-not-used-in-production
      SESSION_TTL_HOURS: "720"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npx prisma generate

      # Next 16 会为路由、页面、布局生成类型（如 LayoutProps）。
      # 这些类型平时由 next dev / next build 顺带产出，CI 是干净检出，
      # 必须先显式生成，否则 tsc 会报「找不到 LayoutProps」。
      - name: 生成 Next 路由类型
        run: npx next typegen

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 测试自己会重建 test schema 并执行仓库里的迁移 SQL，
      # 所以这一步同时验证了「迁移脚本本身是能跑的」
      - name: 测试（单元 + 集成）
        run: npm run test:cov

      - name: 生产构建
        run: npm run build

      # 端到端跑的是真实浏览器 + 真实 HTTP 栈，覆盖上面那些直接调用
      # route handler 的测试碰不到的一层：点击事件、凭证传递、跨页导航。
      # 曾经有一次 CDN 拦掉标准请求头，服务端测试全绿而线上点不动，
      # 就是因为没有任何测试真的发出过 HTTP 请求。
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 应用迁移（端到端需要真实建表）
        run: npx prisma migrate deploy

      - name: 端到端测试
        run: npm run test:e2e

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: 上传端到端失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
